{% extends 'user_portal/base_user_portal.html' %}

{% block portal_title %}My Dashboard{% endblock %}

{% block portal_content %}
<div class="row">
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-success shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs fw-bold text-success text-uppercase mb-1">Events Joined</div>
                        <div class="h5 mb-0 fw-bold text-gray-800">12</div>
                    </div>
                    <div class="col-auto"><i class="bi bi-calendar-event fs-2 text-success"></i></div>
                </div>
            </div>
        </div>
    </div>
    <!-- Repeat for other stats like Points, Certificates, etc. -->
</div>

<div class="card shadow-sm mt-4">
    <div class="card-header bg-white">
        <h6 class="mb-0 fw-bold">Recent Activities</h6>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Activity</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Tree Plantation</td>
                        <td>Oct 12, 2023</td>
                        <td><span class="badge bg-success">Completed</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
