{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 d-md-block bg-dark text-white sidebar collapse" style="min-height: 100vh;">
            <div class="position-sticky pt-3">
                <h5 class="px-3 mb-3 text-warning">Admin Portal</h5>
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item"><a href="{% url 'admin_dashboard' %}" class="nav-link text-white active"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
                    <li><a href="{% url 'admin_users' %}" class="nav-link text-white"><i class="bi bi-people me-2"></i> Users</a></li>
                    <li><a href="{% url 'admin_volunteers' %}" class="nav-link text-white"><i class="bi bi-person-check me-2"></i> Volunteers</a></li>
                    <li><a href="{% url 'admin_memberships' %}" class="nav-link text-white"><i class="bi bi-card-checklist me-2"></i> Memberships</a></li>
                    <li><a href="{% url 'admin_events' %}" class="nav-link text-white"><i class="bi bi-calendar-event me-2"></i> Events</a></li>
                    <li><a href="{% url 'admin_news' %}" class="nav-link text-white"><i class="bi bi-newspaper me-2"></i> News</a></li>
                    <li><a href="{% url 'admin_gallery' %}" class="nav-link text-white"><i class="bi bi-images me-2"></i> Gallery</a></li>
                    <li><a href="{% url 'admin_reports' %}" class="nav-link text-white"><i class="bi bi-graph-up me-2"></i> Reports</a></li>
                    <li><a href="{% url 'admin_settings' %}" class="nav-link text-white"><i class="bi bi-gear me-2"></i> Settings</a></li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 ms-sm-auto px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">{% block admin_title %}Dashboard{% endblock %}</h1>
            </div>
            
            {% block admin_content %}
            <!-- Admin specific content goes here -->
            {% endblock %}
        </div>
    </div>
</div>
{% endblock %}
